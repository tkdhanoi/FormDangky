<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Câu lạc bộ Taekwondo Bạch Mai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            background-image: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }
        /* Custom checkbox styling for a better look */
        .custom-checkbox:checked + div {
            background-color: #dc2626; /* red-600 */
            border-color: #dc2626;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-3xl rounded-2xl shadow-xl overflow-hidden relative">
        
        <!-- Header Banner -->
        <div class="bg-red-600 p-6 text-center text-white">
            <h1 class="text-3xl font-bold tracking-wide uppercase mb-1">Đăng Ký Tham Gia</h1>
            <h2 class="text-xl font-medium opacity-90">Câu lạc bộ Taekwondo Bạch Mai</h2>
        </div>

        <form id="registrationForm" class="p-8 space-y-6">
            
            <!-- Võ sinh info row -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2">
                    <label for="fullName" class="block text-sm font-semibold text-gray-700 mb-1">Họ tên võ sinh <span class="text-red-500">*</span></label>
                    <input type="text" id="fullName" name="fullName" required placeholder="Nhập họ và tên võ sinh" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Giới tính <span class="text-red-500">*</span></label>
                    <div class="flex space-x-4 h-[42px] items-center">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="gender" value="Nam" required class="w-4 h-4 text-red-600 focus:ring-red-500">
                            <span class="text-gray-700">Nam</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="gender" value="Nữ" required class="w-4 h-4 text-red-600 focus:ring-red-500">
                            <span class="text-gray-700">Nữ</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <!-- Cập nhật từ input number sang input date -->
                    <label for="birthDate" class="block text-sm font-semibold text-gray-700 mb-1">Ngày tháng năm sinh <span class="text-red-500">*</span></label>
                    <input type="date" id="birthDate" name="birthDate" required max="2026-12-31"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors">
                </div>
                <div>
                    <label for="idNumber" class="block text-sm font-semibold text-gray-700 mb-1">Số căn cước / Mã định danh</label>
                    <input type="text" id="idNumber" name="idNumber" placeholder="Nhập số CCCD (nếu có)" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors">
                </div>
            </div>

            <div>
                <label for="address" class="block text-sm font-semibold text-gray-700 mb-1">Địa chỉ <span class="text-red-500">*</span></label>
                <input type="text" id="address" name="address" required placeholder="Nhập địa chỉ nơi ở hiện tại" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="parentName" class="block text-sm font-semibold text-gray-700 mb-1">Họ tên phụ huynh <span class="text-gray-400 font-normal">(Dành cho võ sinh < 18 tuổi)</span></label>
                    <input type="text" id="parentName" name="parentName" placeholder="Nhập họ tên phụ huynh" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors">
                </div>
                <div>
                    <label for="phone" class="block text-sm font-semibold text-gray-700 mb-1">Điện thoại liên hệ <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" name="phone" required placeholder="Nhập số điện thoại" pattern="[0-9]{10,11}" title="Vui lòng nhập số điện thoại hợp lệ"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors">
                </div>
            </div>

            <div class="pt-2">
                <label class="block text-sm font-semibold text-gray-700 mb-3">Đăng ký lịch tập (Chọn các buổi có thể tham gia) <span class="text-red-500">*</span></label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="schedule" value="Thứ hai" class="custom-checkbox peer sr-only">
                        <div class="px-4 py-3 border-2 border-gray-200 rounded-lg text-center text-gray-600 font-medium transition-all hover:bg-gray-50">
                            Thứ hai
                        </div>
                    </label>
                    
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="schedule" value="Thứ ba" class="custom-checkbox peer sr-only">
                        <div class="px-4 py-3 border-2 border-gray-200 rounded-lg text-center text-gray-600 font-medium transition-all hover:bg-gray-50">
                            Thứ ba
                        </div>
                    </label>
                    
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="schedule" value="Thứ tư" class="custom-checkbox peer sr-only">
                        <div class="px-4 py-3 border-2 border-gray-200 rounded-lg text-center text-gray-600 font-medium transition-all hover:bg-gray-50">
                            Thứ tư
                        </div>
                    </label>
                    
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="schedule" value="Thứ năm" class="custom-checkbox peer sr-only">
                        <div class="px-4 py-3 border-2 border-gray-200 rounded-lg text-center text-gray-600 font-medium transition-all hover:bg-gray-50">
                            Thứ năm
                        </div>
                    </label>
                    
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="schedule" value="Thứ sáu" class="custom-checkbox peer sr-only">
                        <div class="px-4 py-3 border-2 border-gray-200 rounded-lg text-center text-gray-600 font-medium transition-all hover:bg-gray-50">
                            Thứ sáu
                        </div>
                    </label>
                    
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="schedule" value="Thứ bảy" class="custom-checkbox peer sr-only">
                        <div class="px-4 py-3 border-2 border-gray-200 rounded-lg text-center text-gray-600 font-medium transition-all hover:bg-gray-50">
                            Thứ bảy
                        </div>
                    </label>

                </div>
                <p id="scheduleError" class="text-red-500 text-sm mt-2 hidden">Vui lòng chọn ít nhất 1 buổi tập.</p>
            </div>

            <div class="pt-6 border-t border-gray-100">
                <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all hover:shadow-lg active:transform active:scale-[0.98]">
                    GỬI ĐĂNG KÝ
                </button>
            </div>
        </form>

        <!-- Success Message Overlay (Hidden by default) -->
        <div id="successMessage" class="absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center p-8 hidden z-10 transition-opacity">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-4">
                <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2 text-center">Đăng Ký Thành Công!</h3>
            <p class="text-gray-600 text-center mb-6">Cảm ơn bạn đã tham gia Câu lạc bộ Taekwondo Bạch Mai.</p>
            <button onclick="resetForm()" class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-6 rounded-lg transition-colors">
                Đăng ký người khác
            </button>
        </div>

    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const successMessage = document.getElementById('successMessage');
        const scheduleError = document.getElementById('scheduleError');
        const checkboxes = document.querySelectorAll('input[name="schedule"]');
        const submitBtn = document.getElementById('submitBtn');

        // BƯỚC QUAN TRỌNG: Dán cái URL Web App bạn copy từ Google Apps Script vào đây (Bỏ trong dấu ngoặc kép)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwr7I9zQ84teaDMa6NlDhHEI0fEfRbGnQewTH3IsIE8rzp_lVd5EcohdLNnFkNFU1zXbQ/exec';

        form.addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            // Custom validation: check if at least one schedule day is selected
            let isChecked = false;
            let selectedSchedules = [];
            checkboxes.forEach(function(cb) {
                if (cb.checked) {
                    isChecked = true;
                    selectedSchedules.push(cb.value);
                }
            });

            if (!isChecked) {
                scheduleError.classList.remove('hidden');
                return; // Stop submission
            } else {
                scheduleError.classList.add('hidden');
            }

            // Hiển thị trạng thái đang gửi
            submitBtn.disabled = true;
            submitBtn.innerText = 'ĐANG GỬI DỮ LIỆU...';
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            // Tạo đối tượng dữ liệu để gửi đi
            let formData = new FormData(form);
            // Gộp lịch tập (nhiều ngày) thành một chuỗi duy nhất cách nhau bởi dấu phẩy
            formData.set('schedule', selectedSchedules.join(', '));

            // Gửi dữ liệu qua Google Apps Script
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                // Thành công: Hiện thông báo và xóa trắng form
                successMessage.classList.remove('hidden');
                successMessage.classList.add('flex');
            })
            .catch(error => {
                console.error('Lỗi:', error);
                alert('Có lỗi xảy ra khi gửi dữ liệu. Vui lòng kiểm tra lại mạng hoặc link Script!');
            })
            .finally(() => {
                // Khôi phục nút
                submitBtn.disabled = false;
                submitBtn.innerText = 'GỬI ĐĂNG KÝ';
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            });
        });

        // Hide error when user starts checking boxes
        checkboxes.forEach(function(cb) {
            cb.addEventListener('change', function() {
                scheduleError.classList.add('hidden');
            });
        });

        // Function to reset form and hide success message
        function resetForm() {
            form.reset();
            successMessage.classList.add('hidden');
            successMessage.classList.remove('flex');
        }
    </script>
</body>
</html>
